# ps5-audio-51: HDMI output used only for the AC-3 bitstream. It always opens the device with AES0=0x06
# (non-audio), so the TV or receiver never plays the bitstream as PCM (full-scale noise).
# Needs the HDMI card profile off; nofail keeps PipeWire starting when the card is not available yet.
context.objects = [
  { factory = adapter
    flags = [ nofail ]
    args = {
      factory.name     = api.alsa.pcm.sink
      node.name        = "ps5-hdmi-bitstream"
      node.description = "HDMI bitstream (internal, do not select)"
      media.class      = "Audio/Sink"
      api.alsa.path    = "hdmi:CARD=HDMI,DEV=0,AES0=0x06,AES1=0x82,AES2=0x00,AES3=0x02"
      audio.format     = "S16LE"
      audio.rate       = 48000
      audio.channels   = 2
      audio.position   = [ FL FR ]
      priority.session = 1
      priority.driver  = 2000
    }
  }
]
