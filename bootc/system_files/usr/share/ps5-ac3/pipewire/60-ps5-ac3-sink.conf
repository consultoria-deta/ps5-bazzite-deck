# ps5-audio-51: virtual 5.1 output. What plays here is encoded live to AC-3 and sent over HDMI as a bitstream
# (the PS5's VERDE HDMI bridge passes stereo LPCM or a compressed bitstream, not multichannel LPCM).
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "ps5-ac3-sink"
      node.description = "Dolby Digital 5.1 (HDMI)"
      media.class      = "Audio/Sink"
      audio.rate       = 48000
      audio.channels   = 6
      audio.position   = [ FL FR FC LFE RL RR ]
      monitor.channel-volumes = true
    }
  }
]
