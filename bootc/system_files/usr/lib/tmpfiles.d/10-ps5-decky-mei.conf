# Decky Loader (a PyInstaller binary) unpacks itself to /tmp/_MEI* when it starts. The PS5 has no RTC, so the
# console starts with an old clock and those files get an old date; after the time sync, the 10-day /tmp
# cleanup deletes part of them and Decky's store, plugins and downloads break until Decky restarts.
x /tmp/_MEI*
