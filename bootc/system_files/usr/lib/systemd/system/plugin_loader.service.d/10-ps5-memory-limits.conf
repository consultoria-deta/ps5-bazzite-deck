# Decky Loader on a console with ~10-14 GB of RAM for Linux. With KillMode=process, old plugin processes
# survived every Decky restart, piled up (~2 GB each) and the OOM killer took PipeWire and the session
# instead. Decky now stops with its plugins, has a memory ceiling, and is the first thing the OOM killer takes.
[Service]
KillMode=mixed
Environment=LIVE_RELOAD=0
MemoryHigh=900M
MemoryMax=1500M
OOMScoreAdjust=800
